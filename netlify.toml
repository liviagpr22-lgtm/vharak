# Configuracao de deploy da VHARAK (Netlify).
#
# O site e estatico: o unico passo de build e regerar as paginas a partir
# das fontes em frontend/pages/src. Sem framework, sem bundler.

[build]
  command = "node tools/gerar-paginas.js"
  publish = "frontend"

[build.environment]
  NODE_VERSION = "20"

# As fontes das paginas nao devem ser publicadas.
[[redirects]]
  from = "/pages/src/*"
  to = "/pages/404.html"
  status = 404

# O painel e local: nao precisa aparecer nos buscadores.
[[headers]]
  for = "/pages/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Imagens: cache longo, o nome do arquivo ja muda quando a imagem muda.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O resto do site: cache curto, para as mudancas aparecerem rapido.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
