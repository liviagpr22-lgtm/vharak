<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar no painel | VHARAK Painel</title>
  <meta name="description" content="Acesso ao painel local da VHARAK.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main id="conteudo">
<div class="admin-login">
  <div class="auth-caixa">

    <div class="auth-logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 6H3C1.9 6 1 6.9 1 8v8c0 1.1.9 2 2 2h3l2-2h8l2 2h3c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-8 3.5h-2V12H9.5v-2.5h-2v-2h2V5h2v2.5h2v2zM17.5 12c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5S18.33 12 17.5 12zm3 0c-.83 0-1.5-.67-1.5-1.5S19.67 9 20.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      <span><span class="marca-a">V</span><span class="marca-b">HARAK</span></span>
    </div>

    <h1>Painel da loja</h1>
    <p class="subtitulo">Área de administração local da VHARAK.</p>

    <form id="formulario-admin" novalidate>
      <div class="form-group">
        <label for="senha-admin">Senha do painel</label>
        <input type="password" id="senha-admin" name="senha" autocomplete="current-password" required placeholder="Senha">
      </div>

      <p class="form-error" id="erro-admin" hidden></p>

      <button class="btn btn-primary btn-lg" type="submit">Entrar</button>
    </form>

    <div class="auth-rodape">
      <a href="/">Voltar para a loja</a>
    </div>

    <div class="auth-extra">
      Este painel roda no seu navegador. A senha protege os dados guardados neste dispositivo, não a loja.
    </div>

  </div>
</div>
</main>
<script src="/js/configuracao.js"></script>
<script src="/js/dados-catalogo.js"></script>
<script src="/js/precos.js"></script>
<script src="/js/precos-local.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
