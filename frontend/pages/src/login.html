<!-- titulo: Entrar | VHARAK    -->
<!-- descricao: Entre na sua conta da VHARAK para acompanhar pedidos e salvar seus produtos favoritos.    -->
<!-- ativo: inicio -->
<!-- css: global, header, footer, auth -->
<!-- js: auth-page -->

<main class="main-content">
  <div class="auth">
    <div class="auth-caixa">

      <div class="auth-logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 6H3C1.9 6 1 6.9 1 8v8c0 1.1.9 2 2 2h3l2-2h8l2 2h3c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-8 3.5h-2V12H9.5v-2.5h-2v-2h2V5h2v2.5h2v2zM17.5 12c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5S18.33 12 17.5 12zm3 0c-.83 0-1.5-.67-1.5-1.5S19.67 9 20.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        <span><span class="marca-a">V</span><span class="marca-b">HARAK</span></span>
      </div>

      <h1>Entrar</h1>
      <p class="subtitulo">Acompanhe seus pedidos e retome suas compras.</p>

      <form id="formulario-login" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="você@email.com">
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required placeholder="Sua senha">
        </div>

        <p class="form-error" id="erro-login" hidden></p>

        <button class="btn btn-primary btn-lg" type="submit">Entrar</button>
      </form>

      <div class="auth-rodape">
        Ainda não tem conta? <a href="/pages/cadastro.html">Criar conta</a>
      </div>

      <div class="auth-extra">
        Prefere comprar sem conta? <a href="/pages/catalogo.html">Vai direto ao catálogo</a>.
      </div>

    </div>
  </div>
</main>
